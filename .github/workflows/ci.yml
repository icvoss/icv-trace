name: CI

# Pure-Python rendering of templates/repo/ci-python.yml. This public package
# uses GitHub-hosted runners: ADR-022 prohibits public repository workflows
# from executing pull-request code on the private runner fleet. The additional
# workflow checker enforces this rendered package's public publish contract.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install static tools and package
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.15.22" "mypy>=1.11"
          pip install -e . --no-deps
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/icv_trace
      - run: python scripts/check_publish_workflow.py

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools and package
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e . --no-deps
      - name: Run the Django-free suite
        run: pytest tests -v --tb=short --color=yes

  wheel:
    name: Built wheel (install and test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade pip build pytest
          python -m build --wheel --outdir dist
          pip install --no-deps dist/*.whl
      - name: Confirm the package resolves from the installed wheel
        run: |
          python -c "import os, icv_trace; origin = os.path.realpath(icv_trace.__file__); assert 'site-packages' in origin, origin"
      - name: Run the suite against the installed wheel
        run: pytest tests -v --tb=short --color=yes -o pythonpath=tests
        env:
          ICV_TRACE_REQUIRE_WHEEL: "1"
          PYTHONPATH: tests
