name: Publish icv-trace to PyPI

# Pure-Python rendering of templates/repo/publish-python.yml. The public
# workflow uses GitHub-hosted runners and PyPI OIDC, not private-index netrc.
# PyPI trusted publisher setup remains an external graduation prerequisite.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"
  PACKAGE_NAME: icv-trace
  REQUIRED_WHEEL_FILES: >-
    icv_trace/adapters.py icv_trace/core.py icv_trace/human.py
    icv_trace/py.typed

jobs:
  resolve:
    name: Resolve version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      release_title: ${{ steps.parse.outputs.release_title }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - id: parse
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_title=icv-trace v$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ ^0\. || "$version" =~ (a|b|rc|alpha|beta|dev)[0-9]* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require matching release metadata and a dated changelog entry
        env:
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = os.environ["VERSION"]
          metadata = tomllib.loads(Path("pyproject.toml").read_text())
          assert metadata["project"]["version"] == version
          source = Path("src/icv_trace/__init__.py").read_text()
          found = re.search(r'^__version__ = "([^"]+)"$', source, re.M)
          assert found and found.group(1) == version
          changelog = Path("CHANGELOG.md").read_text()
          heading = re.compile(rf"^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}$", re.M)
          assert heading.search(changelog), f"missing dated changelog heading for {version}"
          unreleased = re.search(r"^## \[Unreleased\]\s*$", changelog, re.M)
          assert unreleased, "missing [Unreleased] heading"
          following = re.search(r"^## ", changelog[unreleased.end():], re.M)
          pending = changelog[unreleased.end() : unreleased.end() + following.start()] if following else changelog[unreleased.end():]
          assert not pending.strip(), "[Unreleased] contains content that the tag would ship"
          PY

  verify:
    name: Static and installed-wheel gates
    runs-on: ubuntu-latest
    needs: resolve
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the publish verification list
        run: |
          python -m pip install --upgrade pip build pytest "ruff==0.15.22" "mypy>=1.11"
          python -m build --wheel --outdir dist
          pip install --no-deps dist/*.whl
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/icv_trace
      - name: Confirm the package resolves from the installed wheel
        run: |
          python -c "import os, icv_trace; origin = os.path.realpath(icv_trace.__file__); assert 'site-packages' in origin, origin"
      - name: Test the installed wheel
        run: pytest tests -v --tb=short --color=yes -o pythonpath=tests
        env:
          ICV_TRACE_REQUIRE_WHEEL: "1"
          PYTHONPATH: tests

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [resolve, verify]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
          python - <<'PY'
          import glob
          import os
          import zipfile

          with zipfile.ZipFile(glob.glob("dist/*.whl")[0]) as wheel:
              names = set(wheel.namelist())
          required = set(os.environ["REQUIRED_WHEEL_FILES"].split())
          missing = required - names
          assert not missing, f"wheel is missing: {sorted(missing)}"
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ needs.resolve.outputs.version }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish icv-trace to PyPI
    runs-on: ubuntu-latest
    needs: [resolve, build]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.resolve.outputs.version }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve, publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.resolve.outputs.version }}
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.resolve.outputs.release_title }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.resolve.outputs.prerelease }}
          fail_on_unmatched_files: true
