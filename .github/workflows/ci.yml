name: CI

# Pure-Python adaptation of templates/repo/ci.yml. There are no Django,
# database, migration or smoke-test legs. Every install runs in a job-local
# venv because the private runner is persistent.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and types
    runs-on: [self-hosted, icv-vps]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Create a job-local virtualenv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install static tools and package
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.15.22" "mypy>=1.11"
          pip install -e . --no-deps
      - name: Verify no sibling repo leaked onto sys.path
        run: |
          python - <<'PY'
          import importlib.util, os
          workspace = os.path.realpath(os.environ["GITHUB_WORKSPACE"])
          work_root = os.path.realpath(os.path.join(workspace, "..", ".."))
          spec = importlib.util.find_spec("icv_trace")
          assert spec and spec.origin, "icv_trace is not importable"
          origin = os.path.realpath(spec.origin)
          assert not origin.startswith(work_root + os.sep) or origin.startswith(workspace + os.sep), origin
          PY
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/icv_trace
      - run: python scripts/check_publish_workflow.py

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: [self-hosted, icv-vps]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create a job-local virtualenv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install test tools and package
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e . --no-deps
      - name: Verify no sibling repo leaked onto sys.path
        run: |
          python - <<'PY'
          import importlib.util, os
          workspace = os.path.realpath(os.environ["GITHUB_WORKSPACE"])
          work_root = os.path.realpath(os.path.join(workspace, "..", ".."))
          spec = importlib.util.find_spec("icv_trace")
          assert spec and spec.origin, "icv_trace is not importable"
          origin = os.path.realpath(spec.origin)
          assert not origin.startswith(work_root + os.sep) or origin.startswith(workspace + os.sep), origin
          PY
      - name: Run the Django-free suite
        run: pytest tests -v --tb=short --color=yes

  wheel:
    name: Built wheel (install and test)
    runs-on: [self-hosted, icv-vps]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Create a job-local virtualenv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade pip build pytest
          python -m build --wheel --outdir dist
          pip install --no-deps dist/*.whl
      - name: Verify no sibling repo leaked onto sys.path
        run: |
          python - <<'PY'
          import importlib.util, os
          workspace = os.path.realpath(os.environ["GITHUB_WORKSPACE"])
          work_root = os.path.realpath(os.path.join(workspace, "..", ".."))
          spec = importlib.util.find_spec("icv_trace")
          assert spec and spec.origin, "icv_trace is not importable"
          origin = os.path.realpath(spec.origin)
          assert not origin.startswith(work_root + os.sep) or origin.startswith(workspace + os.sep), origin
          PY
      - name: Confirm the package resolves from the installed wheel
        run: |
          python -c "import os, icv_trace; origin = os.path.realpath(icv_trace.__file__); assert 'site-packages' in origin, origin"
      - name: Run the suite against the installed wheel
        run: pytest tests -v --tb=short --color=yes -o pythonpath=tests
        env:
          ICV_TRACE_REQUIRE_WHEEL: "1"
          PYTHONPATH: tests
